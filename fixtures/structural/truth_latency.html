<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Truth latency and completeness</title>
  <style>
    #single { position: absolute; top: 0; right: 0; width: 1px; pointer-events: none; }
    #generic-dialog { position: fixed; inset: 1rem auto auto 1rem; }
    #remove-slot { min-height: 1lh; }
  </style>
</head>
<body>
  <h1>Truth latency and completeness</h1>
  <button id="start" type="button" aria-pressed="false">Start latency run</button>
  <p role="status" id="initial">Latency initial pending</p>
  <div id="single"></div>
  <div id="batch10"></div>
  <div id="batch100"></div>
  <div id="remove-slot"><p role="status" id="remove-target">Remove target</p></div>
  <p role="status" id="replace-target">Replace target old</p>
  <p role="status" id="lifecycle">Latency lifecycle idle</p>
  <div id="generic-dialog" role="dialog" aria-label="Submission result" hidden>
    <div><div style="display: contents"><span id="generic-dialog-message"></span></div></div>
  </div>
  <div id="live-result" aria-live="polite">Live result idle</div>
  <ol id="reorder"></ol>
  <canvas id="canvas" aria-label="Canvas semantic companion idle" width="120" height="60"></canvas>
  <canvas id="webgl" aria-label="WebGL semantic companion idle" data-saccade-context="webgl" width="120" height="60"></canvas>
  <p role="status" id="done">Latency test waiting</p>
  <script>
    const stamp = (kind, item) => `LT|${kind}|${item}|${performance.timeOrigin + performance.now()}`;
    const statusNodes = (root, count, prefix) => {
      for (let index = 0; index < count; index += 1) {
        const node = document.createElement('p');
        node.id = `${prefix}-${index}`;
        node.setAttribute('role', 'status');
        node.textContent = `${prefix} idle ${index}`;
        root.appendChild(node);
      }
    };
    statusNodes(document.getElementById('batch10'), 10, 'batch10');
    statusNodes(document.getElementById('batch100'), 100, 'batch100');
    const reorder = document.getElementById('reorder');
    for (let index = 0; index < 100; index += 1) {
      const item = document.createElement('li');
      item.textContent = `Stable reorder item ${index}`;
      reorder.appendChild(item);
    }
    document.getElementById('initial').textContent = stamp('initial', '1');

    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function run() {
      await delay(1000);
      for (let sequence = 1; sequence <= 20; sequence += 1) {
        const node = document.createElement('p');
        node.id = `single-${sequence}`;
        node.setAttribute('role', 'status');
        node.textContent = stamp('single', sequence);
        document.getElementById('single').appendChild(node);
        await delay(80);
      }
      const batch10At = performance.timeOrigin + performance.now();
      for (let index = 0; index < 10; index += 1) {
        document.getElementById(`batch10-${index}`).textContent = `LT|batch10|${index}|${batch10At}`;
      }
      await delay(250);
      const batch100At = performance.timeOrigin + performance.now();
      for (let index = 0; index < 100; index += 1) {
        document.getElementById(`batch100-${index}`).textContent = `LT|batch100|${index}|${batch100At}`;
      }
      await delay(250);
      document.getElementById('remove-target').remove();
      document.getElementById('lifecycle').textContent = stamp('remove', 'event');
      await delay(250);
      const old = document.getElementById('replace-target');
      const replacement = document.createElement('p');
      replacement.id = 'replace-target';
      replacement.setAttribute('role', 'status');
      replacement.textContent = stamp('replace', 'new');
      old.replaceWith(replacement);
      await delay(250);
      for (const item of Array.from(reorder.children).reverse()) reorder.appendChild(item);
      reorder.firstElementChild.textContent = stamp('reorder', 'event');
      await delay(250);
      const canvas = document.getElementById('canvas');
      const context2d = canvas.getContext('2d');
      context2d.fillStyle = '#1565c0';
      context2d.fillRect(10, 10, 80, 30);
      canvas.setAttribute('aria-label', stamp('canvas', 'semantic'));
      await delay(250);
      const webgl = document.getElementById('webgl');
      const gl = webgl.getContext('webgl');
      if (gl) {
        gl.clearColor(0.2, 0.7, 0.3, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
      webgl.setAttribute('aria-label', stamp('webgl', 'semantic'));
      await delay(250);
      const dialog = document.getElementById('generic-dialog');
      dialog.hidden = false;
      document.getElementById('generic-dialog-message').textContent = stamp('dialog', 'text');
      document.getElementById('live-result').textContent = stamp('live', 'status');
      await delay(250);
      document.getElementById('done').textContent = stamp('done', '1');
    }
    document.getElementById('start').addEventListener('click', (event) => {
      const start = event.currentTarget;
      if (start.getAttribute('aria-pressed') === 'true') return;
      start.setAttribute('aria-pressed', 'true');
      run();
    });
  </script>
</body>
</html>
