<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saccade ordinary mouse accuracy fixture</title>
    <style>
      body { margin: 0; font: 16px system-ui; background: #f5f5f5; }
      main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 160px 24px; padding: 40px; }
      .cell { display: flex; min-width: 0; }
      .cell:nth-child(3n + 1) { justify-content: flex-start; }
      .cell:nth-child(3n + 2) { justify-content: center; }
      .cell:nth-child(3n) { justify-content: flex-end; }
      button { box-sizing: border-box; padding: 0; font: 12px system-ui; }
    </style>
  </head>
  <body>
    <main id="targets"></main>
    <script>
      const sizes = [32, 40, 48];
      const root = document.getElementById('targets');
      for (let index = 1; index <= 24; index += 1) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const button = document.createElement('button');
        const size = sizes[(Math.floor((index - 1) / 3) + (index - 1) % 3) % sizes.length];
        button.type = 'button';
        button.style.width = `${size}px`;
        button.style.height = `${size}px`;
        button.setAttribute('aria-label', `Accuracy ${String(index).padStart(2, '0')}`);
        button.setAttribute('aria-pressed', 'false');
        button.textContent = String(index).padStart(2, '0');
        button.addEventListener('click', () => {
          button.setAttribute('aria-pressed', String(button.getAttribute('aria-pressed') !== 'true'));
        });
        cell.appendChild(button);
        root.appendChild(cell);
      }
    </script>
  </body>
</html>
