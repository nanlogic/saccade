<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deferred dialog effect fixture</title>
    <style>
      body { font: 16px system-ui; margin: 48px; }
      button { min-height: 40px; }
      [role="dialog"] { border: 1px solid #555; padding: 24px; margin-top: 24px; opacity: 0; transition: opacity 250ms; }
      [role="dialog"].show { opacity: 1; }
    </style>
  </head>
  <body>
    <form id="registration">
      <button type="submit">Submit registration</button>
    </form>
    <section id="confirmation" role="dialog" aria-modal="true" aria-labelledby="confirmation-title" hidden>
      <div id="confirmation-title">Thanks for submitting the fixture</div>
      <table><tbody><tr><th>Result</th><td>Accepted</td></tr></tbody></table>
    </section>
    <script>
      document.getElementById('registration').addEventListener('submit', (event) => {
        event.preventDefault();
        const confirmation = document.getElementById('confirmation');
        confirmation.hidden = false;
        requestAnimationFrame(() => confirmation.classList.add('show'));
      });
    </script>
  </body>
</html>
