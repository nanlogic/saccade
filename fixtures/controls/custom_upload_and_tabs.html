<!doctype html>
<meta charset="utf-8">
<title>Custom upload and tabs</title>
<style>
.store_tab,
.asset_upload_drop_target,
.drag_and_drop_file_upload { cursor: pointer; }
</style>
<nav>
  <div class="store_tab">Graphical Assets</div>
  <div class="store_tab">Trailers</div>
</nav>
<div class="asset_upload_drop_target">
  <input id="asset-upload" type="file" accept="image/*" hidden>
  <span>Drop images here or select files</span>
</div>
<div class="drag_and_drop_file_upload">Drag and drop screenshot files to upload</div>
<div>Choose screenshot files to upload</div>
