<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Generated review queue</title><style>body{font:16px system-ui;margin:32px}main{max-width:640px;display:grid;gap:16px}article{border:1px solid #bbb;padding:20px;border-radius:12px}button{font:inherit;min-height:42px;margin-right:10px}[role=status]{min-height:24px}</style></head>
<body><main><h1>One-time review queue</h1><article id="card"><h2>Record 1 of 25</h2>
<p>Record ID: <strong id="record-id">LUMEN-7256-1</strong></p>
<p>Risk score: <strong id="risk">40</strong></p><p>Evidence: <strong id="evidence">missing</strong></p>
<button id="approve" type="button" aria-pressed="false">Approve record</button>
<button id="reject" type="button" aria-pressed="false">Reject record</button></article><div id="status" role="status"></div></main><script>const C={"records":[{"id":"LUMEN-7256-1","risk":40,"evidence":false,"expected":"reject"},{"id":"CEDAR-9035-2","risk":30,"evidence":true,"expected":"approve"},{"id":"MARBLE-8905-3","risk":7,"evidence":false,"expected":"reject"},{"id":"EMBER-7865-4","risk":33,"evidence":true,"expected":"approve"},{"id":"HARBOR-1646-5","risk":62,"evidence":true,"expected":"reject"},{"id":"JUNIPER-3288-6","risk":35,"evidence":true,"expected":"approve"},{"id":"MARBLE-2990-7","risk":71,"evidence":false,"expected":"reject"},{"id":"GLACIER-2986-8","risk":7,"evidence":false,"expected":"reject"},{"id":"DELTA-2986-9","risk":49,"evidence":true,"expected":"reject"},{"id":"AMBER-3994-10","risk":2,"evidence":false,"expected":"reject"},{"id":"LUMEN-6093-11","risk":9,"evidence":false,"expected":"reject"},{"id":"FABLE-2253-12","risk":31,"evidence":true,"expected":"approve"},{"id":"GLACIER-2819-13","risk":21,"evidence":true,"expected":"approve"},{"id":"HARBOR-6028-14","risk":79,"evidence":false,"expected":"reject"},{"id":"HARBOR-9834-15","risk":35,"evidence":true,"expected":"approve"},{"id":"INDIGO-9719-16","risk":49,"evidence":true,"expected":"reject"},{"id":"INDIGO-6641-17","risk":20,"evidence":false,"expected":"reject"},{"id":"MARBLE-8282-18","risk":88,"evidence":true,"expected":"reject"},{"id":"GLACIER-5022-19","risk":83,"evidence":false,"expected":"reject"},{"id":"DELTA-4594-20","risk":71,"evidence":true,"expected":"reject"},{"id":"KEPLER-2717-21","risk":23,"evidence":false,"expected":"reject"},{"id":"CEDAR-4118-22","risk":43,"evidence":true,"expected":"approve"},{"id":"HARBOR-2799-23","risk":79,"evidence":false,"expected":"reject"},{"id":"GLACIER-5423-24","risk":35,"evidence":true,"expected":"approve"},{"id":"KEPLER-6344-25","risk":28,"evidence":false,"expected":"reject"}],"marker":"QUEUE-PROOF-4C397E338D-REPLACEMENT-25","mode":"replacement"};let i=0,errors=0;
function render(){const r=C.records[i];if(!r){document.getElementById('card')?.remove();document.getElementById('status').textContent=C.marker;return;}
const markup="<article id=\"card\"><h2>Record 1 of 25</h2>\n<p>Record ID: <strong id=\"record-id\">LUMEN-7256-1</strong></p>\n<p>Risk score: <strong id=\"risk\">40</strong></p><p>Evidence: <strong id=\"evidence\">missing</strong></p>\n<button id=\"approve\" type=\"button\" aria-pressed=\"false\">Approve record</button>\n<button id=\"reject\" type=\"button\" aria-pressed=\"false\">Reject record</button></article>";
if(C.mode==='replacement'&&i>0){const holder=document.createElement('div');holder.innerHTML=markup;document.getElementById('card').replaceWith(holder.firstElementChild);bind();}
document.querySelector('#card h2').textContent=`Record ${i+1} of ${C.records.length}`;document.getElementById('record-id').textContent=r.id;document.getElementById('risk').textContent=r.risk;document.getElementById('evidence').textContent=r.evidence?'present':'missing';}
function choose(choice,event){const r=C.records[i];if(choice!==r.expected){errors++;document.getElementById('status').textContent=`Incorrect choice; errors ${errors}`;return;}
event.currentTarget.setAttribute('aria-pressed',event.currentTarget.getAttribute('aria-pressed')==='true'?'false':'true');document.getElementById('status').textContent=`Accepted ${r.id}`;i++;render();}
function bind(){document.getElementById('approve').onclick=(e)=>choose('approve',e);document.getElementById('reject').onclick=(e)=>choose('reject',e);}bind();render();</script></body></html>
