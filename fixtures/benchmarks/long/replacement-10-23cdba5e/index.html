<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Generated review queue</title><style>body{font:16px system-ui;margin:32px}main{max-width:640px;display:grid;gap:16px}article{border:1px solid #bbb;padding:20px;border-radius:12px}button{font:inherit;min-height:42px;margin-right:10px}[role=status]{min-height:24px}</style></head>
<body><main><h1>One-time review queue</h1><article id="card"><h2>Record 1 of 10</h2>
<p>Record ID: <strong id="record-id">KEPLER-7826-1</strong></p>
<p>Risk score: <strong id="risk">92</strong></p><p>Evidence: <strong id="evidence">missing</strong></p>
<button id="approve" type="button" aria-pressed="false">Approve record</button>
<button id="reject" type="button" aria-pressed="false">Reject record</button></article><div id="status" role="status"></div></main><script>const C={"records":[{"id":"KEPLER-7826-1","risk":92,"evidence":false,"expected":"reject"},{"id":"EMBER-6955-2","risk":83,"evidence":false,"expected":"reject"},{"id":"HARBOR-4905-3","risk":97,"evidence":false,"expected":"reject"},{"id":"MARBLE-4804-4","risk":37,"evidence":false,"expected":"reject"},{"id":"DELTA-8013-5","risk":42,"evidence":true,"expected":"approve"},{"id":"LUMEN-3680-6","risk":11,"evidence":true,"expected":"approve"},{"id":"DELTA-9581-7","risk":77,"evidence":false,"expected":"reject"},{"id":"MARBLE-8430-8","risk":19,"evidence":false,"expected":"reject"},{"id":"CEDAR-3333-9","risk":1,"evidence":false,"expected":"reject"},{"id":"JUNIPER-8277-10","risk":67,"evidence":true,"expected":"reject"}],"marker":"QUEUE-PROOF-23CDBA5E3C-REPLACEMENT-10","mode":"replacement"};let i=0,errors=0;
function render(){const r=C.records[i];if(!r){document.getElementById('card')?.remove();document.getElementById('status').textContent=C.marker;return;}
const markup="<article id=\"card\"><h2>Record 1 of 10</h2>\n<p>Record ID: <strong id=\"record-id\">KEPLER-7826-1</strong></p>\n<p>Risk score: <strong id=\"risk\">92</strong></p><p>Evidence: <strong id=\"evidence\">missing</strong></p>\n<button id=\"approve\" type=\"button\" aria-pressed=\"false\">Approve record</button>\n<button id=\"reject\" type=\"button\" aria-pressed=\"false\">Reject record</button></article>";
if(C.mode==='replacement'&&i>0){const holder=document.createElement('div');holder.innerHTML=markup;document.getElementById('card').replaceWith(holder.firstElementChild);bind();}
document.querySelector('#card h2').textContent=`Record ${i+1} of ${C.records.length}`;document.getElementById('record-id').textContent=r.id;document.getElementById('risk').textContent=r.risk;document.getElementById('evidence').textContent=r.evidence?'present':'missing';}
function choose(choice,event){const r=C.records[i];if(choice!==r.expected){errors++;document.getElementById('status').textContent=`Incorrect choice; errors ${errors}`;return;}
event.currentTarget.setAttribute('aria-pressed',event.currentTarget.getAttribute('aria-pressed')==='true'?'false':'true');document.getElementById('status').textContent=`Accepted ${r.id}`;i++;render();}
function bind(){document.getElementById('approve').onclick=(e)=>choose('approve',e);document.getElementById('reject').onclick=(e)=>choose('reject',e);}bind();render();</script></body></html>
