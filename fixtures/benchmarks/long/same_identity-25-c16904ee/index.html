<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Generated review queue</title><style>body{font:16px system-ui;margin:32px}main{max-width:640px;display:grid;gap:16px}article{border:1px solid #bbb;padding:20px;border-radius:12px}button{font:inherit;min-height:42px;margin-right:10px}[role=status]{min-height:24px}</style></head>
<body><main><h1>One-time review queue</h1><article id="card"><h2>Record 1 of 25</h2>
<p>Record ID: <strong id="record-id">GLACIER-6560-1</strong></p>
<p>Risk score: <strong id="risk">88</strong></p><p>Evidence: <strong id="evidence">present</strong></p>
<button id="approve" type="button" aria-pressed="false">Approve record</button>
<button id="reject" type="button" aria-pressed="false">Reject record</button></article><div id="status" role="status"></div></main><script>const C={"records":[{"id":"GLACIER-6560-1","risk":88,"evidence":true,"expected":"reject"},{"id":"HARBOR-3551-2","risk":40,"evidence":false,"expected":"reject"},{"id":"LUMEN-9236-3","risk":57,"evidence":false,"expected":"reject"},{"id":"HARBOR-6577-4","risk":77,"evidence":true,"expected":"reject"},{"id":"MARBLE-8389-5","risk":46,"evidence":false,"expected":"reject"},{"id":"LUMEN-5596-6","risk":87,"evidence":true,"expected":"reject"},{"id":"JUNIPER-8986-7","risk":93,"evidence":false,"expected":"reject"},{"id":"DELTA-2919-8","risk":10,"evidence":false,"expected":"reject"},{"id":"JUNIPER-1396-9","risk":22,"evidence":false,"expected":"reject"},{"id":"HARBOR-5293-10","risk":13,"evidence":false,"expected":"reject"},{"id":"INDIGO-8260-11","risk":1,"evidence":true,"expected":"approve"},{"id":"FABLE-7784-12","risk":71,"evidence":false,"expected":"reject"},{"id":"HARBOR-6677-13","risk":32,"evidence":false,"expected":"reject"},{"id":"GLACIER-7343-14","risk":59,"evidence":false,"expected":"reject"},{"id":"DELTA-1111-15","risk":73,"evidence":true,"expected":"reject"},{"id":"CEDAR-4814-16","risk":9,"evidence":false,"expected":"reject"},{"id":"HARBOR-7292-17","risk":62,"evidence":false,"expected":"reject"},{"id":"GLACIER-9599-18","risk":22,"evidence":false,"expected":"reject"},{"id":"GLACIER-2302-19","risk":18,"evidence":false,"expected":"reject"},{"id":"JUNIPER-5700-20","risk":34,"evidence":true,"expected":"approve"},{"id":"INDIGO-1121-21","risk":12,"evidence":true,"expected":"approve"},{"id":"KEPLER-9037-22","risk":73,"evidence":false,"expected":"reject"},{"id":"MARBLE-2471-23","risk":25,"evidence":false,"expected":"reject"},{"id":"EMBER-6384-24","risk":90,"evidence":false,"expected":"reject"},{"id":"FABLE-9814-25","risk":97,"evidence":true,"expected":"reject"}],"marker":"QUEUE-PROOF-C16904EEDF-SAME_IDENTITY-25","mode":"same_identity"};let i=0,errors=0;
function render(){const r=C.records[i];if(!r){document.getElementById('card')?.remove();document.getElementById('status').textContent=C.marker;return;}
const markup="<article id=\"card\"><h2>Record 1 of 25</h2>\n<p>Record ID: <strong id=\"record-id\">GLACIER-6560-1</strong></p>\n<p>Risk score: <strong id=\"risk\">88</strong></p><p>Evidence: <strong id=\"evidence\">present</strong></p>\n<button id=\"approve\" type=\"button\" aria-pressed=\"false\">Approve record</button>\n<button id=\"reject\" type=\"button\" aria-pressed=\"false\">Reject record</button></article>";
if(C.mode==='replacement'&&i>0){const holder=document.createElement('div');holder.innerHTML=markup;document.getElementById('card').replaceWith(holder.firstElementChild);bind();}
document.querySelector('#card h2').textContent=`Record ${i+1} of ${C.records.length}`;document.getElementById('record-id').textContent=r.id;document.getElementById('risk').textContent=r.risk;document.getElementById('evidence').textContent=r.evidence?'present':'missing';}
function choose(choice,event){const r=C.records[i];if(choice!==r.expected){errors++;document.getElementById('status').textContent=`Incorrect choice; errors ${errors}`;return;}
event.currentTarget.setAttribute('aria-pressed',event.currentTarget.getAttribute('aria-pressed')==='true'?'false':'true');document.getElementById('status').textContent=`Accepted ${r.id}`;i++;render();}
function bind(){document.getElementById('approve').onclick=(e)=>choose('approve',e);document.getElementById('reject').onclick=(e)=>choose('reject',e);}bind();render();</script></body></html>
