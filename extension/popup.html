<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saccade</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <img class="brand-icon" src="icons/icon-48.png" alt="">
        <div class="brand-copy">
          <div class="title-row">
            <h1>Saccade</h1>
            <span id="dev-badge" class="dev-badge" hidden>DEV</span>
          </div>
          <p>Browser truth layer</p>
        </div>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-line">
          <span id="status-dot" class="status-dot pending" aria-hidden="true"></span>
          <strong id="state">Checking</strong>
          <span class="separator" aria-hidden="true"></span>
          <span id="phase">This tab…</span>
        </div>
        <p id="detail">Checking whether this tab is available to your Agent.</p>
      </section>

      <button id="toggle" type="button" disabled>
        <span id="toggle-label">Share this tab</span>
      </button>

      <footer class="meta">
        <span class="meta-item">
          <span id="host-dot" class="meta-dot" aria-hidden="true"></span>
          <span id="host">Runtime checking</span>
        </span>
        <span class="meta-item">
          <span class="shield" aria-hidden="true"></span>
          Session only
        </span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
