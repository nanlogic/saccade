name: Prepare Node-only release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.2.0
        required: true
        default: v0.2.2

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/setup/package-lock.json
      - name: Install package dependencies
        run: npm ci --prefix packages/setup
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "const p=require('./packages/setup/package.json'); if(process.env.RELEASE_TAG !== 'v'+p.version) process.exit(1)"
          test "$(git tag --points-at HEAD | grep -cx "$RELEASE_TAG")" = 1
      - name: Node, Extension, and architecture gates
        run: |
          node --test packages/setup/test/*.test.js
          node --test extension/tests/*.test.js
          npm pack ./packages/setup --dry-run
          python3 scripts/check_single_architecture.py
          python3 scripts/package_extension_release.py --extension-root extension --output dist/extension
      - uses: actions/upload-artifact@v4
        with:
          name: saccade-node-${{ inputs.tag }}
          path: dist/extension
          if-no-files-found: error
