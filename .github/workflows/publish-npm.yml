name: Publish setup package

on:
  release:
    types: [published]

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/setup/package-lock.json
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1
      - name: Install package dependencies
        run: npm ci --prefix packages/setup
      - name: Test the unpublished source package
        run: |
          node --test packages/setup/test/*.test.js
          npm pack ./packages/setup --dry-run
      - name: Publish with provenance
        working-directory: packages/setup
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG !== 'v'+p.version) process.exit(1)"
          npm publish --access public --provenance
