  <text x="1139" y="78" text-anchor="middle" fill="#d6e6ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">LOCAL CHECKS</text>

  <text x="58" y="184" fill="#ffffff" font-family="Arial, sans-serif" font-size="59" font-weight="750" letter-spacing="-1.5">The target is current</text>
