<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1a385f" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#paper)"/>
  <image href="saccade-icon.png" x="56" y="45" width="50" height="50"/>
  <text x="122" y="80" fill="#0a2147" font-family="Arial, sans-serif" font-size="27" font-weight="700">Saccade</text>
  <rect x="1033" y="52" width="187" height="40" rx="20" fill="#e3efff"/>
  <text x="1127" y="78" text-anchor="middle" fill="#2461a7" font-family="Arial, sans-serif" font-size="15" font-weight="700">ACTION + EVIDENCE</text>

  <text x="58" y="176" fill="#0a2147" font-family="Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">Know what happened</text>
  <text x="58" y="238" fill="#1b6ee8" font-family="Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">without checking twice.</text>
  <text x="61" y="298" fill="#536a88" font-family="Arial, sans-serif" font-size="23">Every action returns a compact receipt and the relevant page change.</text>

  <g transform="translate(62 353)" filter="url(#shadow)">
    <rect width="665" height="338" rx="30" fill="#ffffff" stroke="#dce6f2"/>
    <text x="30" y="50" fill="#17375e" font-family="Arial, sans-serif" font-size="17" font-weight="700">ACTION RECEIPT</text>
    <rect x="30" y="75" width="605" height="74" rx="20" fill="#eaf9f3"/>
    <circle cx="70" cy="112" r="23" fill="#11a66d"/>
    <path d="M59 112l8 8 16-19" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="107" y="105" fill="#0c4b36" font-family="Arial, sans-serif" font-size="18" font-weight="700">Save changes</text>
    <text x="107" y="132" fill="#34725c" font-family="Arial, sans-serif" font-size="16">status: saved</text>
    <g transform="translate(30 177)">
      <rect width="180" height="54" rx="16" fill="#eef4fb"/>
      <circle cx="27" cy="27" r="9" fill="#14ae73"/><text x="46" y="34" fill="#214767" font-family="Arial, sans-serif" font-size="16" font-weight="700">ACCEPTED</text>
    </g>
    <g transform="translate(226 177)">
      <rect width="180" height="54" rx="16" fill="#eef4fb"/>
      <circle cx="27" cy="27" r="9" fill="#14ae73"/><text x="46" y="34" fill="#214767" font-family="Arial, sans-serif" font-size="16" font-weight="700">OBSERVED</text>
    </g>
    <g transform="translate(422 177)">
      <rect width="180" height="54" rx="16" fill="#eef4fb"/>
      <circle cx="27" cy="27" r="9" fill="#14ae73"/><text x="46" y="34" fill="#214767" font-family="Arial, sans-serif" font-size="16" font-weight="700">VERIFIED</text>
    </g>
    <path d="M30 264h575" stroke="#e2eaf3" stroke-width="2"/>
    <text x="30" y="301" fill="#6b8199" font-family="Arial, sans-serif" font-size="15" font-weight="700">RELEVANT CHANGE</text>
    <text x="184" y="301" fill="#17375e" font-family="Arial, sans-serif" font-size="17">save status: pending → saved</text>
  </g>

  <g transform="translate(781 394)" filter="url(#shadow)">
    <rect width="438" height="237" rx="30" fill="#102c58"/>
    <circle cx="50" cy="50" r="23" fill="#ffcc62"/>
    <text x="50" y="58" text-anchor="middle" fill="#5e4200" font-family="Arial, sans-serif" font-size="26" font-weight="800">?</text>
    <text x="88" y="45" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">If the result is uncertain</text>
    <text x="88" y="71" fill="#bcd0ed" font-family="Arial, sans-serif" font-size="16">Saccade says so clearly.</text>
    <rect x="30" y="104" width="378" height="78" rx="19" fill="#183d73"/>
    <text x="54" y="136" fill="#ffd77f" font-family="Arial, sans-serif" font-size="15" font-weight="700">OUTCOME UNKNOWN</text>
    <text x="54" y="163" fill="#d6e4f7" font-family="Arial, sans-serif" font-size="17">No automatic replay after a side effect.</text>
    <text x="30" y="215" fill="#91add3" font-family="Arial, sans-serif" font-size="15">The Agent can stop instead of guessing.</text>
  </g>

  <text x="60" y="775" fill="#8296ae" font-family="Arial, sans-serif" font-size="17">04 / 05</text>
  <text x="1220" y="775" text-anchor="end" fill="#8296ae" font-family="Arial, sans-serif" font-size="17">github.com/nanlogic/saccade</text>
</svg>
