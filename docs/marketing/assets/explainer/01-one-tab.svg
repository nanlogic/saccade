<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="1" stop-color="#0b2f70"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="44%" r="52%">
      <stop offset="0" stop-color="#1478ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#1478ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020919" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>
  <circle cx="1124" cy="102" r="190" fill="#1d75ff" opacity=".08"/>
  <circle cx="1160" cy="680" r="260" fill="#54e2c2" opacity=".05"/>

  <image href="saccade-icon.png" x="56" y="45" width="50" height="50"/>
  <text x="122" y="80" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Saccade</text>
  <rect x="1055" y="52" width="165" height="40" rx="20" fill="#ffffff" opacity=".10"/>
  <text x="1137" y="78" text-anchor="middle" fill="#d8e6ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">CHROME + EDGE</text>

  <text x="58" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="63" font-weight="750" letter-spacing="-1.8">Give your AI one tab</text>
  <text x="58" y="260" fill="#68a8ff" font-family="Arial, sans-serif" font-size="63" font-weight="750" letter-spacing="-1.8">it can own.</text>
  <text x="61" y="329" fill="#c6d7f2" font-family="Arial, sans-serif" font-size="24">The Agent knows exactly which tab it owns.</text>
  <text x="61" y="365" fill="#c6d7f2" font-family="Arial, sans-serif" font-size="24">Everything else stays outside that session.</text>

  <g transform="translate(51 435)" filter="url(#shadow)">
    <rect width="470" height="155" rx="28" fill="#102c5a" stroke="#2f70d7" stroke-width="2"/>
    <rect x="24" y="22" width="78" height="30" rx="15" fill="#1d75ff"/>
    <text x="63" y="43" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">LEASED</text>
    <text x="24" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">One tab. One writer.</text>
    <text x="24" y="124" fill="#a9c2e8" font-family="Arial, sans-serif" font-size="19">No accidental cross-tab actions.</text>
  </g>

  <image href="brand-hero.png" x="560" y="145" width="690" height="480" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(743 585)" filter="url(#shadow)">
    <rect width="405" height="94" rx="25" fill="#ffffff"/>
    <circle cx="50" cy="47" r="22" fill="#daf8ed"/>
    <path d="M39 47l8 8 16-19" fill="none" stroke="#12a56b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="85" y="41" fill="#0b234b" font-family="Arial, sans-serif" font-size="16" font-weight="700">AUTHORIZED TAB</text>
    <text x="85" y="67" fill="#355171" font-family="Arial, sans-serif" font-size="18">Current and ready for the Agent</text>
  </g>

  <text x="60" y="748" fill="#7f9cc8" font-family="Arial, sans-serif" font-size="17">01 / 05</text>
  <text x="1220" y="748" text-anchor="end" fill="#7f9cc8" font-family="Arial, sans-serif" font-size="17">github.com/nanlogic/saccade</text>
</svg>
