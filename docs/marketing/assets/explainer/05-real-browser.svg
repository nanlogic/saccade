      <text x="83" y="46" fill="#17375e" font-family="Arial, sans-serif" font-size="16" font-weight="700">YOUR AI</text>
      <text x="83" y="70" fill="#66809c" font-family="Arial, sans-serif" font-size="14">Agent</text>
    </g>
    <path d="M218 89h73" stroke="#8eb7ee" stroke-width="5" stroke-linecap="round"/><path d="M277 77l16 12-16 12" fill="none" stroke="#8eb7ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(310 34)">
      <rect width="170" height="110" rx="23" fill="#edf4ff"/>
      <text x="85" y="48" text-anchor="middle" fill="#17375e" font-family="Arial, sans-serif" font-size="20" font-weight="700">MCP</text>
      <text x="85" y="76" text-anchor="middle" fill="#66809c" font-family="Arial, sans-serif" font-size="14">six tools</text>
    </g>
    <path d="M498 89h73" stroke="#8eb7ee" stroke-width="5" stroke-linecap="round"/><path d="M557 77l16 12-16 12" fill="none" stroke="#8eb7ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(590 34)">
      <rect width="188" height="110" rx="23" fill="#102d5a"/>
      <text x="94" y="48" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">NODE BROKER</text>
      <text x="94" y="76" text-anchor="middle" fill="#a9c4e9" font-family="Arial, sans-serif" font-size="14">local state</text>
    </g>
    <path d="M796 89h73" stroke="#8eb7ee" stroke-width="5" stroke-linecap="round"/><path d="M855 77l16 12-16 12" fill="none" stroke="#8eb7ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
