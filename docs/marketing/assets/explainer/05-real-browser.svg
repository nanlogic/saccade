      <circle cx="51" cy="55" r="28" fill="#ffffff"/>
      <image href="saccade-icon.png" x="27" y="31" width="48" height="48"/>
      <text x="91" y="48" fill="#164932" font-family="Arial, sans-serif" font-size="17" font-weight="700">AUTHORIZED TAB</text>
      <text x="91" y="75" fill="#4f7566" font-family="Arial, sans-serif" font-size="14">Chrome or Edge</text>
