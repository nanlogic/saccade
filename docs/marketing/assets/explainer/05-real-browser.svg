    <text x="196" y="46" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">INSTALL THE EXTENSION</text>
    <text x="196" y="75" text-anchor="middle" fill="#dceaff" font-family="Arial, sans-serif" font-size="16">Then start a new Agent task</text>
