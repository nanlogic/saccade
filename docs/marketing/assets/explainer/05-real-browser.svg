<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06142e"/><stop offset=".6" stop-color="#0c2d62"/><stop offset="1" stop-color="#124e92"/></linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b82ff"/><stop offset="1" stop-color="#145bd4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020814" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1090" cy="155" r="300" fill="#2d87ff" opacity=".12"/>
  <circle cx="205" cy="720" r="240" fill="#53deb5" opacity=".06"/>
  <image href="saccade-icon.png" x="56" y="45" width="50" height="50"/>
  <text x="122" y="80" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Saccade</text>
  <rect x="1016" y="52" width="204" height="40" rx="20" fill="#ffffff" opacity=".10"/>
  <text x="1118" y="78" text-anchor="middle" fill="#d8e8ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">NODE + EXTENSION</text>

  <text x="58" y="174" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">Use the browser</text>
  <text x="58" y="237" fill="#69aaff" font-family="Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">you already use.</text>
  <text x="61" y="298" fill="#c5d7f1" font-family="Arial, sans-serif" font-size="23">Your signed-in Chrome or Edge session stays where the work already is.</text>

  <g transform="translate(61 365)" filter="url(#shadow)">
