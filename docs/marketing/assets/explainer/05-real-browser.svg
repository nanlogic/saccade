  <text x="60" y="759" fill="#7795c0" font-family="Arial, sans-serif" font-size="17">05 / 05</text>
  <text x="1220" y="759" text-anchor="end" fill="#9bb5d8" font-family="Arial, sans-serif" font-size="17">github.com/nanlogic/saccade</text>
