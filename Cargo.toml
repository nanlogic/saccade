[workspace]
resolver = "2"
members = [
  "crates/saccade_protocol",
  "crates/saccade_control_sdk",
  "crates/saccade_host_client",
  "crates/saccade_runtime",
  "bins/saccade-runtime",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.3"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
